<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>都卜勒效應｜波前觀察室</title><style>
*{box-sizing:border-box}body{margin:auto;max-width:1250px;background:#f4f6f3;color:#183b38;padding:clamp(14px,3vw,42px);font:17px system-ui,sans-serif}h1{font-size:clamp(28px,4vw,50px);margin:.3em 0}main{display:grid;grid-template-columns:3fr minmax(230px,1fr);gap:16px}section,aside{background:white;padding:16px;border-radius:18px}canvas{width:100%;display:block;border-radius:12px;background:#102e33}button{min-height:46px;background:#e8efed;color:#193e39;border:0;border-radius:10px;padding:9px 14px;font:inherit;cursor:pointer}button.active,#play{background:#126453;color:white}nav,footer{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}label{display:block;margin:20px 0}output{float:right;font-weight:bold}input{width:100%;height:36px;accent-color:#176754}strong{font-size:26px}p{line-height:1.6}@media(max-width:740px){main{grid-template-columns:1fr}}

.readings{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.card{background:#eef5f2;padding:12px;border-radius:10px}.card label{margin:0;display:flex;align-items:center;gap:5px;min-height:42px;flex-wrap:wrap}.card input{width:18px;height:18px}.card output{margin-left:auto;font-variant-numeric:tabular-nums}select{min-height:42px;font:inherit}aside label{margin:14px 0}h2{font-size:18px;margin:0 0 8px}
[hidden]{display:none!important}#road{width:100%;height:auto;background:#173b42;border-radius:12px}nav button[aria-pressed=true]{background:#126453;color:white}#vehicle{cursor:grab;touch-action:none;pointer-events:bounding-box}#vehicle.dragging{cursor:grabbing}#road{touch-action:pan-y}</style><h1>都卜勒效應</h1><nav aria-label="演示選擇"><button id="labTab" aria-pressed="true">雙觀察者</button><button id="roadTab" aria-pressed="false">救護車經過</button></nav><main id="lab"><section><canvas id="view" aria-label="左右兩位觀察者與中央音源的聲波波前"></canvas><label>試聽　<select id="listen"><option value="-1">靜音</option><option value="0">左觀察者</option><option value="1">右觀察者</option></select></label><div class="readings" id="cards"></div><footer><button id="play">▶ 播放</button><button id="step">前進 ¼ 週期</button><button id="reset">回到起點</button></footer><small id="status"></small></section><aside id="controls"><h2>運動設定</h2><div id="settings"></div><hr><p>聲速 340 m/s<br>音源頻率 <span id="sourceHz"></span> Hz</p><small>視波速為波峰相對該觀察者的速率。勾選下方讀值，可比較兩側。變更運動設定會回到起點。</small></aside></main><main id="ambulance" hidden><section><svg id="road" viewBox="-15 0 790 330" role="img" aria-label="救護車向右行駛，觀察者站在路旁"><rect y="115" width="720" height="100" fill="#456168"/><path d="M0 164H720" stroke="#e3e6cc" stroke-width="3" stroke-dasharray="24 18"/><line id="sight" y1="142" x2="360" y2="244" stroke="white" stroke-width="2" stroke-dasharray="6 5"/><circle cx="360" cy="244" r="8" fill="#ffc573"/><text x="360" y="279" text-anchor="middle" fill="white" font-size="18">路旁觀察者</text><g id="vehicle"><rect x="-40" y="129" width="80" height="66" fill="transparent"/><path d="M-37 145h47l15 13h10v21h-72z" fill="#f8faf5"/><path d="M10 148l12 11H10z" fill="#537b89"/><path d="M-23 152v16m-8-8h16" stroke="#cd4d48" stroke-width="5"/><rect x="-4" y="139" width="14" height="6" rx="2" fill="#ff695b"/><g fill="#172b30" stroke="#cddbd8" stroke-width="2"><circle cx="-24" cy="179" r="7"/><circle cx="22" cy="179" r="7"/></g></g><defs><marker id="arrowBlue" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#70dbff"/></marker><marker id="arrowGold" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="3" markerHeight="3" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#ffd06c"/></marker></defs><line id="horizontal" y1="142" y2="142" stroke="#70dbff" stroke-width="4" marker-end="url(#arrowBlue)"/><line id="radial" y1="142" stroke="#ffd06c" stroke-width="4" marker-end="url(#arrowGold)"/><circle id="sirenPoint" cy="142" r="4" fill="white"/></svg><footer><button id="drive">▶ 播放並試聽</button><button id="beside">停在正側方</button><button id="again">回到起點</button></footer></section><aside><h2>救護車鳴笛</h2><p>發聲頻率　440 Hz<br><span style="border-left:5px solid #2583a3;padding-left:8px">水平速度　向右 30 m/s</span></p><p style="border-left:5px solid #d89a22;padding-left:8px">沿虛線的速度分量<br><strong id="projection"></strong></p><label><input id="audible" type="checkbox" checked style="width:20px;height:20px;vertical-align:middle"> 開啟聲音</label><p>觀察者聽到的頻率<br><strong id="heard"></strong></p><small>可直接左右拖曳救護車。虛線由音源連到觀察者。朝向觀察者取正，遠離取負。此刻發出的聲音稍後才會抵達，聽到的音高對應發聲時的速度分量。</small></aside></main><script>
const el=id=>document.getElementById(id);
for(const [id,name,value] of [['s','音源',40],['o','兩位觀察者',0]]){
 el('settings').insertAdjacentHTML('beforeend','<label>'+name+'方向　<select id="'+id+'dir"><option value="1">向右 →</option><option value="-1">向左 ←</option></select></label><label>'+name+'速率 <output id="'+id+'val"></output><input type="range" id="'+id+'" min="0" max="80" step="5" value="'+value+'"></label>');
}
const sourceFrequency=440;
el('sourceHz').textContent=sourceFrequency;
const sites=[{start:155,side:-1,name:'左觀察者'},{start:505,side:1,name:'右觀察者'}];
for(const [i,site] of sites.entries()){
 const rows=['視波速','視波長','視頻率'].map((name,j)=>'<label><input type="checkbox" id="toggle'+i+j+'">'+name+' <output id="read'+i+j+'"></output></label>').join('');
 el('cards').insertAdjacentHTML('beforeend','<div class="card"><b>'+site.name+'</b>'+rows+'</div>');
}
let time=0,playing=false,last=0;
const speed=id=>Number(el(id).value)*Number(el(id+'dir').value)/100;
let audio, oscillator, gain, currentTone=0;
function enableAudio(){
 if(el('listen').value==='-1')return;
 const AudioEngine=window.AudioContext||window.webkitAudioContext;
 if(!AudioEngine){el('listen').value='-1';return}
 if(!audio){
  audio=new AudioEngine();
  oscillator=audio.createOscillator();gain=audio.createGain();
  gain.gain.value=0;oscillator.connect(gain);gain.connect(audio.destination);oscillator.start();
 }
 if(audio.state==='suspended')audio.resume().catch(()=>{});
}
function setTone(hz){
 if(!audio||hz===currentTone)return;
 currentTone=hz;
 if(hz)oscillator.frequency.setTargetAtTime(hz,audio.currentTime,.005);
 gain.gain.setTargetAtTime(hz ? 0.09 : 0,audio.currentTime,.008);
}
el('listen').onchange=()=>{enableAudio();draw()};
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;draw()}});
function endTime(){
 const s=speed('s'),o=speed('o');
 let limit=60;
 for(const [start,v] of [[330,s],[155,o],[505,o]]){
  if(v)limit=Math.min(limit,((v>0?625:35)-start)/(30*v));
 }
 if(s!==o)limit=Math.min(limit,175/(30*Math.abs(s-o)));
 return limit;
}
function draw(){
 const s=speed('s'),o=speed('o'),canvas=el('view'),ctx=canvas.getContext('2d');
 const width=Math.max(1,Math.round(canvas.clientWidth*(window.devicePixelRatio||1)));
 if(canvas.width!==width||canvas.height!==Math.round(width*.5)){canvas.width=width;canvas.height=Math.round(width*.5)}
 ctx.setTransform(canvas.width/660,0,0,canvas.height/330,0,0);ctx.clearRect(0,0,660,330);
 for(let n=0;n<time;n++){ctx.beginPath();ctx.arc(330+30*s*n,165,30*(time-n),0,2*Math.PI);ctx.strokeStyle='#73d7cb';ctx.stroke()}
 function marker(x,name,color,offset){ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,165,7,0,2*Math.PI);ctx.fill();ctx.font='bold 17px system-ui';ctx.textAlign='center';ctx.fillText(name,x,165+offset)}
 marker(330+30*s*time,'音源','#ffc573',-20);
 let tone=0;
 sites.forEach(({start,side,name},i)=>{
  const x=start+30*o*time;

  const waveSpeed=340*(1-side*o),wavelength=(340/sourceFrequency)*(1-side*s);
  const values=[waveSpeed.toFixed(0)+' m/s',wavelength.toFixed(2)+' m',(waveSpeed/wavelength).toFixed(1)+' Hz'];
  const arrived=time>0 && 30*time+1e-8>=Math.abs(x-330);
  // Emission time of the crest currently reaching this observer, in source periods.
  const phase=(time*(1-side*o)-side*(start-330)/30)/(1-side*s);
  const pulse=arrived?Math.max(0,1-((Math.max(0,phase)+1e-9)%1)/.22):0;
  if(pulse){ctx.beginPath();ctx.arc(x,165,10+6*(1-pulse),0,2*Math.PI);ctx.strokeStyle='rgba(255,215,110,'+pulse+')';ctx.lineWidth=4;ctx.stroke();ctx.lineWidth=1}
  marker(x,name,pulse?'#ffdb80':'white',32);
  if(playing&&arrived&&Number(el('listen').value)===i)tone=waveSpeed/wavelength;
  values.forEach((v,j)=>el('read'+i+j).textContent=el('toggle'+i+j).checked?(arrived?v:time?'待抵達':'—'):'');
 });
 setTone(tone);
 for(const id of ['s','o'])el(id+'val').textContent=Math.round(Math.abs(speed(id))*340)+' m/s';
 el('play').textContent=playing?'Ⅱ 暫停':time>=endTime()?'重新播放':'▶ 播放';
 el('status').textContent=time>=endTime()?'本次演示結束。按「重新播放」可再看一次。':'每條圓線代表一個波峰。';
}
function reset(){time=0;playing=false;draw()}
function advance(dt){time=Math.min(time+dt,endTime());if(time>=endTime())playing=false;draw()}
el('settings').oninput=reset;el('cards').onchange=draw;el('reset').onclick=reset;
el('play').onclick=()=>{enableAudio();if(time>=endTime())time=0;playing=!playing;last=performance.now();draw()};
el('step').onclick=()=>{playing=false;advance(.25)};
function frame(now){if(playing)advance(Math.min(.1,(now-last)/1000)*1.4);last=now;requestAnimationFrame(frame)}
window.onresize=draw;draw();requestAnimationFrame(frame);
// Road scene uses metres and seconds. Sound reaching the listener now was
// emitted earlier; solve c * delay = distance to that emission position.
const roadSpeed=30, soundSpeed=340, roadsideDistance=(244-142)/2.65, travel=240;
let roadTime=0,driving=false,roadLast=0,roadFrame=0;
let roadAudio,roadOsc,roadGain;
function received(x){
 const a=soundSpeed**2-roadSpeed**2;
 const delay=(-x*roadSpeed+Math.sqrt((x*roadSpeed)**2+a*(x*x+roadsideDistance**2)))/a;
 const emissionX=x-roadSpeed*delay;
 return sourceFrequency/(1+roadSpeed*emissionX/(soundSpeed*Math.hypot(emissionX,roadsideDistance)));
}
function unlockRoad(){
 if(!el('audible').checked)return;
 const Engine=window.AudioContext||window.webkitAudioContext;
 if(!Engine){el('heard').title='此瀏覽器無法播放聲音';el('audible').checked=false;return}
 if(!roadAudio){
  roadAudio=new Engine();roadOsc=roadAudio.createOscillator();roadGain=roadAudio.createGain();
  roadOsc.type='triangle';roadGain.gain.value=0;roadOsc.connect(roadGain);roadGain.connect(roadAudio.destination);roadOsc.start();
 }
 if(roadAudio.state!=='running')roadAudio.resume().catch(()=>{});
}
function renderRoad(){
 const x=roadSpeed*roadTime-travel/2,hz=received(x);
 const start=360+x*2.65;
 const distance=Math.hypot(x,roadsideDistance);
 const ux=-x/distance,uy=roadsideDistance/distance;
 const component=roadSpeed*ux;
 for(const id of ['horizontal','radial','sight'])el(id).setAttribute('x1',start);
 el('sirenPoint').setAttribute('cx',start);
 el('horizontal').setAttribute('x2',start+66);
 el('radial').setAttribute('x2',start+66*ux*ux);
 el('radial').setAttribute('y2',142+66*ux*uy);
 el('radial').setAttribute('visibility',Math.abs(component)<.05?'hidden':'visible');
 el('projection').textContent=(component>0?'+':'')+component.toFixed(1)+' m/s';
 el('vehicle').setAttribute('transform','translate('+(360+x*2.65)+' 0)');
 el('heard').textContent=hz.toFixed(1)+' Hz';
 el('drive').textContent=driving?'Ⅱ 暫停':roadTime>=travel/roadSpeed?'重新播放':roadTime?'▶ 繼續播放':'▶ 播放並試聽';
 if(roadAudio){
  roadOsc.frequency.setTargetAtTime(hz,roadAudio.currentTime,.012);
  const volume=driving&&el('audible').checked ? .13/Math.sqrt(1+(x/40)**2) : 0;
  roadGain.gain.setTargetAtTime(volume,roadAudio.currentTime,.015);
 }
}
function stopRoad(){driving=false;cancelAnimationFrame(roadFrame);renderRoad()}
function tickRoad(now){
 roadTime=Math.min(travel/roadSpeed,roadTime+(now-roadLast)/1000);roadLast=now;
 if(roadTime>=travel/roadSpeed)driving=false;
 renderRoad();if(driving)roadFrame=requestAnimationFrame(tickRoad);
}
el('drive').onclick=()=>{
 if(driving){stopRoad();return}
 if(roadTime>=travel/roadSpeed)roadTime=0;
 unlockRoad();driving=true;roadLast=performance.now();renderRoad();roadFrame=requestAnimationFrame(tickRoad);
};
el('audible').onchange=()=>{unlockRoad();renderRoad()};
el('beside').onclick=()=>{roadTime=travel/(2*roadSpeed);stopRoad()};
const vehicle=el('vehicle'),road=el('road');
let drag=null;
function pointerX(event){
 const point=road.createSVGPoint();
 point.x=event.clientX;point.y=event.clientY;
 return point.matrixTransform(road.getScreenCTM().inverse()).x;
}
vehicle.onpointerdown=event=>{
 if(event.button!==0||drag)return;
 event.preventDefault();
 stopRoad();
 drag={id:event.pointerId,offset:pointerX(event)-(360+(roadSpeed*roadTime-travel/2)*2.65)};
 vehicle.setPointerCapture(event.pointerId);
 vehicle.classList.add('dragging');
};
function moveCar(event){
 if(!drag||event.pointerId!==drag.id)return;
 const metres=(pointerX(event)-drag.offset-360)/2.65;
 roadTime=Math.max(0,Math.min(travel/roadSpeed,(metres+travel/2)/roadSpeed));
 renderRoad();
}
function releaseCar(event){
 if(!drag||event.pointerId!==drag.id)return;
 drag=null;vehicle.classList.remove('dragging');
}
vehicle.onpointermove=moveCar;
vehicle.onpointerup=event=>{moveCar(event);releaseCar(event)};
vehicle.onlostpointercapture=vehicle.onpointercancel=releaseCar;
el('again').onclick=()=>{roadTime=0;stopRoad()};
function selectScene(road){
 playing=false;stopRoad();el('lab').hidden=road;el('ambulance').hidden=!road;
 el('labTab').setAttribute('aria-pressed',String(!road));el('roadTab').setAttribute('aria-pressed',String(road));draw();
}
el('roadTab').onclick=()=>selectScene(true);el('labTab').onclick=()=>selectScene(false);
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopRoad()});renderRoad();
</script></html>
